<style>
/* ================= BASE ================= */
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background:#f8fafc;
    color:#1e293b;
    overflow-x:hidden;
}

body.dark{
    background:#0f172a;
    color:#f1f5f9;
}

/* ================= TOP BAR ================= */
.topBar{
    display:flex;
    align-items:center;
    justify-style:space-between;
    padding:10px 16px;
    background:#1e293b;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
    position:sticky;
    top:0;
    z-index:10;
    gap: 10px;
}

body.dark .topBar{
    background:#020617;
    border-bottom: 1px solid #1e293b;
}

#searchInput{
    flex: 1;
    min-width: 0;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 13px;
    background: rgba(255,255,255,0.95);
    outline: none;
    transition: all 0.2s ease;
}

#searchInput:focus {
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
}

.topRight{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink: 0;
}

.darkToggle{
    font-size:18px;
    cursor:pointer;
    user-select:none;
    padding: 6px;
    border-radius: 50%;
    transition: background 0.2s;
}

.darkToggle:hover {
    background: rgba(255,255,255,0.1);
}

.navTopBtn {
    background: rgba(255, 255, 255, 0.1);
    color: #f8fafc;
    border: none;

function initAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

window.addEventListener('click', initAudioContext);
window.addEventListener('touchstart', initAudioContext);

function playUrgentAlarmSound() {
    try {
        initAudioContext();
        let now = audioCtx.currentTime;
        for (let i = 0; i < 3; i++) {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, now + (i * 0.25));
            gain.gain.setValueAtTime(0.6, now + (i * 0.25));
            gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.25) + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + (i * 0.25));
            osc.stop(now + (i * 0.25) + 0.2);
        }
    } catch (e) {}
}

function playNotificationSound() {
    try {
        initAudioContext();
        let now = audioCtx.currentTime;
        let osc1 = audioCtx.createOscillator();
        let gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(523.25, now);
        osc1.frequency.exponentialRampToValueAtTime(880, now + 0.2);
        gain1.gain.setValueAtTime(0.4, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.4);
    } catch (e) {}
}

function handleTestButtonClick() {
    playNotificationSound();
    let activeItems = savedData.filter(d => !d.done);
    if (activeItems.length === 0) {
        showModal("ℹ️", "အချက်အလက် မရှိပါ", "<center>လက်ရှိ လာမည့်ရက်များတွင် စာမေးပွဲ/အတန်း မရှိသေးပါ။</center>", null, false);
        return;
    }

    let now = new Date();
    let tomorrowObj = new Date(now);
    tomorrowObj.setDate(now.getDate() + 1);
    let tYear = tomorrowObj.getFullYear();
    let tMonth = String(tomorrowObj.getMonth() + 1).padStart(2, '0');
    let tDayStr = String(tomorrowObj.getDate()).padStart(2, '0');
    let tomorrowDateStr = `${tYear}-${tMonth}-${tDayStr}`;

    let tomorrowItems = activeItems.filter(item => item.date === tomorrowDateStr);

    if (tomorrowItems.length > 0) {
        let detailsHTML = tomorrowItems.map(item => `
            <div style="background:rgba(239, 68, 68, 0.1); padding:10px; border-radius:10px; margin-top:8px; border-left:3px solid #ef4444; font-size:12px;">

                <b>📅 Date:</b> ${item.date} (${item.day})<br>

        showModal("🚨", "မနက်ဖြန် ဖြေဆိုရမည့် စာမေးပွဲ", detailsHTML, null, false);

        showModal("ℹ️", "သတင်းအချက်အလက်", "<center>မနက်ဖြန်တွင် စာမေးပွဲ မရှိပါ။</center>", null, false);

}

    } else {
        currentTab = "active";
        document.getElementById("historyNavBtn").innerHTML = "<span>📜</span> History";
        document.getElementById("pageTitle").innerText = "📅 Active Timetables";
    }
    render();
}

function setDay(){
    if(!dateInput.value) {
        dayBox.innerText = "-";
        return;
    }
    let d = new Date(dateInput.value);
    let days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    dayBox.innerText = days[d.getUTCDay()];
}

function openAddForm(){
    clearForm();
    editIndex = -1;
    show('formPage');
}

function clearForm(){
    dateInput.value = "";
    dayBox.innerText = "-";
    subject.value = "";
    type.value = "tutorial";
    time.value = "";
    exactReminder.value = "30";
    noteInput.value = "";
}

function formatAMPM(timeString) {
    if(!timeString) return "";
    let [hours, minutes] = timeString.split(':');
    hours = parseInt(hours);
    let ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; 
    return `${hours}:${minutes} ${ampm}`;
}

function checkExactAlarm(item) {
    if (item.done || item.exactNotified) return;

    let now = new Date();
    let itemDateTime = new Date(`${item.date}T${item.time}`);
    let leadMinutes = parseInt(item.exactReminder || 30);
    let alarmTime = new Date(itemDateTime.getTime() - (leadMinutes * 60 * 1000));

    if (now >= alarmTime && now < itemDateTime) {
        playUrgentAlarmSound();
        sendPushNotification(`⏰ ${item.subject}`, `${item.type} စတင်ရန် ${leadMinutes} မိနစ်ခန့်သာ လိုပါတော့သည်။`);
        item.exactNotified = true;
    }
}

function checkOneDayAlarm(item) {
    if (item.done) return;

    let now = new Date();
    let itemDateTime = new Date(`${item.date}T${item.time}`);
    let timeDiff = itemDateTime - now;
    let hoursLeft = timeDiff / (1000 * 60 * 60);

    if (hoursLeft > 0 && hoursLeft <= 24) {
        if (!item.notified) {
            playNotificationSound(); 
            sendPushNotification("🚨 မနက်ဖြန် စာမေးပွဲ/အတန်း ရှိပါသည်", `${item.subject} (${item.type}) - Time: ${formatAMPM(item.time)}`);
            item.notified = true;
        }
    }
}

function autoCheckExpired(){
    let now = new Date();
    let updated = false;

    savedData.forEach(item => {
        checkOneDayAlarm(item);
        checkExactAlarm(item);

        if(!item.done && item.date && item.time){
            let itemDateTime = new Date(`${item.date}T${item.time}`);
            if(now > itemDateTime){
                item.done = true;
                updated = true;
            }
        }
    });

    if(updated){
        localStorage.setItem("data", JSON.stringify(savedData));
    }
}

function saveData(){
    if(!dateInput.value || !subject.value || !time.value){
        showModal("⚠️", "သတိပေးချက်", "<center>ကျေးဇူးပြု၍ အချက်အလက်များ ဖြည့်စွက်ပါ။</center>", null, false);
        return;
    }

    let obj = {
        date: dateInput.value,
        day: dayBox.innerText,
        subject: subject.value,
        type: type.value,
        time: time.value,
        exactReminder: exactReminder.value,
        note: noteInput.value,
        done: false,
        notified: false,
        exactNotified: false
    };

    if(editIndex >= 0){
        obj.done = savedData[editIndex].done;
        obj.notified = savedData[editIndex].notified;
        obj.exactNotified = savedData[editIndex].exactNotified;
        savedData[editIndex] = obj;
    }else{
        savedData.push(obj);
    }

    autoCheckExpired();
    savedData.sort((a,b) => new Date(a.date) - new Date(b.date));
    localStorage.setItem("data", JSON.stringify(savedData));
    render();
    show("savedPage");
}

function getTypeClass(t){
    t = (t||"").toLowerCase();
    if(t.includes("tutorial")) return "tutorial";
    if(t.includes("assignment")) return "assignment";
    if(t.includes("quiz")) return "quiz";
    if(t.includes("discussion")) return "discussion";
    return "default";
}

function render(){
    autoCheckExpired(); 

    let box = document.getElementById("savedBox");
    box.innerHTML = "";

    let searchText = searchInput.value.toLowerCase();
    let clearAllBtn = document.getElementById("clearAllBtn");

    clearAllBtn.style.display = (savedData.length > 0) ? "inline-flex" : "none";

    let todayObj = new Date();
    let year = todayObj.getFullYear();
    let month = String(todayObj.getMonth() + 1).padStart(2, '0');
    let dayStr = String(todayObj.getDate()).padStart(2, '0');
    let todayDateStr = `${year}-${month}-${dayStr}`;

    let tomorrowObj = new Date(todayObj);
    tomorrowObj.setDate(todayObj.getDate() + 1);
    let tYear = tomorrowObj.getFullYear();
    let tMonth = String(tomorrowObj.getMonth() + 1).padStart(2, '0');
    let tDayStr = String(tomorrowObj.getDate()).padStart(2, '0');
    let tomorrowDateStr = `${tYear}-${tMonth}-${tDayStr}`;

    let filteredData = savedData.filter(d => {
        let matchesSearch = d.subject.toLowerCase().includes(searchText) || d.type.toLowerCase().includes(searchText);
        let matchesTab = (currentTab === "history") ? d.done : !d.done;
        return matchesSearch && matchesTab;
    });

    if(filteredData.length === 0){
        box.innerHTML = `<div class="emptyMsg">${currentTab === "history" ? "ပြီးစီးခဲ့သည့် အချက်အလက် မရှိပါ။" : "အချက်အလက် မရှိသေးပါ။"}</div>`;
        return;
    }

    filteredData.forEach((d)=>{
        let originalIndex = savedData.indexOf(d);
        let isToday = (d.date === todayDateStr);
        let isTomorrow = (d.date === tomorrowDateStr);
        let isDone = d.done;
        
        let cardStateClass = (isToday && !isDone) ? "today" : ((isTomorrow && !isDone) ? "one-day-alert" : (isDone ? "completed" : ""));
        
        let statusTag = "";
        if (!isDone) {
            if (isToday) statusTag = `<span class="status-pill pill-today">🔥 Today</span>`;
            else if (isTomorrow) statusTag = `<span class="status-pill pill-tomorrow">⚠️ Tomorrow</span>`;
        } else {
            statusTag = `<span class="status-pill pill-completed">✅ Completed</span>`;
        }

        let noteHTML = d.note ? `<div class="note-box">📝 ${d.note}</div>` : "";
        let reminderText = `⏱️ Alarm: ${d.exactReminder || 30}m before`;

        box.innerHTML += `
        <div class="item ${cardStateClass}">
            <div class="card-top-row">
                <div class="date-group">
                    <span class="date">📅 ${d.date} (${d.day})</span>
                    ${statusTag}
                </div>
                <span class="badge ${getTypeClass(d.type)}">${d.type}</span>
            </div>

            <div class="subject-title">📚 ${d.subject}</div>

            <div class="meta-row">
                <span class="time-text">⏰ ${formatAMPM(d.time)}</span>
                <span class="reminder-chip">${reminderText}</span>
            </div>

            ${noteHTML}

            <div class="actionBtns">
                <button class="iconBtn editBtn" onclick="editData(${originalIndex})">
                    <span>✏️</span> Edit
                </button>
                <button class="iconBtn deleteBtn" onclick="confirmDeleteData(${originalIndex})">
                    <span>🗑️</span> Delete
                </button>
            </div>
        </div>`;
    });
}

function editData(i){
    let d = savedData[i];
    dateInput.value = d.date;
    subject.value = d.subject;
    type.value = d.type;
    time.value = d.time;
    exactReminder.value = d.exactReminder || "30";
    noteInput.value = d.note || "";
    setDay();
    editIndex = i;
    show('formPage');
}

function showModal(icon, title, msgHTML, actionCallback, showCancelBtn = true) {
    document.getElementById("modalIcon").innerText = icon;
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalMsg").innerHTML = msgHTML;
    
    let cancelBtn = document.querySelector(".btn-cancel");
    let confirmBtn = document.getElementById("modalConfirmBtn");
    
    cancelBtn.style.display = showCancelBtn ? "block" : "none";
    confirmBtn.innerText = showCancelBtn ? "ဖျက်မည်" : "ပိတ်မည်";

    onConfirmAction = actionCallback;
    document.getElementById("confirmModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("confirmModal").style.display = "none";
    onConfirmAction = null;
}

document.getElementById("modalConfirmBtn").onclick = function() {
    if (onConfirmAction) {
        onConfirmAction();
    }
    closeModal();
};

function confirmDeleteData(i) {
    showModal("🗑️", "ဖျက်ရန် သေချာပါသလား?", "<center>ဤ Timetable ကို ဖျက်လိုက်ပါမည်။</center>", function() {
        savedData.splice(i, 1);
        localStorage.setItem("data", JSON.stringify(savedData));
        render();
    }, true);
}

function confirmClearAll() {
    showModal("⚠️", "အားလုံးကို ဖျက်မည်", "<center>အချက်အလက် အားလုံးကို ဖျက်ရန် သေချာပါသလား?</center>", function() {
        savedData = [];
        localStorage.removeItem("data");
        render();
    }, true);
}

setInterval(() => {
    autoCheckExpired();
    render();
}, 5000);

render();
</script>

</body>
</html>
